<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Divelog</title>
    <!-- Fontstyle -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jura:wght@300..700&display=swap" rel="stylesheet">
    <!-- Logotyp och Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/faviconS.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/images/faviconL.png">
    <!-- CSS -->
    <link rel="stylesheet" href="/css/site.css">
</head>

<body>

    <div class="offline-wrapper">
        <img src="/images/faviconL.png" alt="Divelog logo" class="offline-logo">

        <h1>Du är offline</h1>
        <p>Ingen internetanslutning kunde hittas.</p>
        <p>Kontrollera nätverket och försök igen.</p>

        <button onclick="window.location.reload()">Försök igen</button>
    </div>

</body>

</html>
